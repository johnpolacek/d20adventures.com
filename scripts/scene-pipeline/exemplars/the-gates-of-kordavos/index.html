import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ============================================================ utils
function mulberry32(a){return ()=> {a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20240901);
const rr=(a,b)=>a+(b-a)*R();
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;

class Noise{
  constructor(seed){const r=mulberry32(seed);this.g=new Float32Array(256*256);for(let i=0;i<this.g.length;i++)this.g[i]=r();}
  v(x,y,px=256,py=256){let xi=Math.floor(x),yi=Math.floor(y);const fx=x-xi,fy=y-yi;xi=((xi%px)+px)%px;yi=((yi%py)+py)%py;const x1=(xi+1)%px,y1=(yi+1)%py;const g=this.g;const a=g[yi*256+xi],b=g[yi*256+x1],c=g[y1*256+xi],d=g[y1*256+x1];const u=fx*fx*(3-2*fx),w=fy*fy*(3-2*fy);const ab=a+(b-a)*u;return ab+((c+(d-c)*u)-ab)*w;}
  // tileable fbm over unit uv
  fbm(u,v,base=8,oct=5){let a=1,s=0,n=0,p=base;for(let i=0;i<oct&&p<=256;i++){s+=a*this.v(u*p+i*11.3,v*p+i*7.1,p,p);n+=a;a*=0.5;p*=2;}return s/n;}
  // free-space fbm
  f(x,y,oct=4){let a=1,s=0,n=0;for(let i=0;i<oct;i++){s+=a*this.v(x,y);n+=a;a*=0.5;x=x*2.03+13.7;y=y*2.03+5.1;}return s/n;}
}
const NZ=new Noise(7), TN=new Noise(99);

const loadmsg=document.getElementById('loadmsg');const tick=()=>new Promise(r=>setTimeout(r,16));
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
let maxAniso=8;
function canvasTex(c,srgb=true){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=maxAniso;return t;}
function normalFromHeight(H,w,h,S=8){const c=makeCanvas(w,h),ctx=c.getContext('2d'),img=ctx.createImageData(w,h),d=img.data;
  for(let y=0;y<h;y++){const ym=(y-1+h)%h,yp=(y+1)%h;for(let x=0;x<w;x++){const xm=(x-1+w)%w,xp=(x+1)%w;
    const dx=(H[y*w+xp]-H[y*w+xm])*S,dy=(H[ym*w+x]-H[yp*w+x])*S;const l=1/Math.sqrt(dx*dx+dy*dy+1);const i=(y*w+x)*4;
    d[i]=(-dx*l*0.5+0.5)*255;d[i+1]=(dy*l*0.5+0.5)*255;d[i+2]=(l*0.5+0.5)*255;d[i+3]=255;}}
  ctx.putImageData(img,0,0);return canvasTex(c,false);}
function grayTex(A,w,h){const c=makeCanvas(w,h),ctx=c.getContext('2d'),img=ctx.createImageData(w,h),d=img.data;for(let i=0;i<w*h;i++){const v=clamp(A[i],0,1)*255;d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255;}ctx.putImageData(img,0,0);return canvasTex(c,false);}
function texSet(src,ru,rv,rot=0){const o={};for(const k of ['map','normalMap','roughnessMap','alphaMap']){if(src[k]){const t=src[k].clone();t.repeat.set(ru,rv);t.rotation=rot;t.needsUpdate=true;o[k]=t;}}return o;}

// ============================================================ procedural textures
function stoneTexture({size=1024,rows=10,base=[0.68,0.55,0.46],grey=[0.62,0.58,0.54],mortar=[0.28,0.25,0.22],seed=3,chipAmt=1}={}){
  const r=mulberry32(seed);const c=makeCanvas(size,size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size),px=img.data;
  const H=new Float32Array(size*size),Rg=new Float32Array(size*size);const rowH=size/rows;const rowsData=[];
  for(let ri=0;ri<rows;ri++){const off=r()*rowH*2.5;const cuts=[];let x=0;while(x<size){let w=rowH*(1.3+r()*1.5);if(size-x-w<rowH*0.9)w=size-x;cuts.push({x0:x,x1:Math.min(x+w,size),tint:(()=>{const k=1+(r()-.5)*.34,w=r()-.5;return[k*(1+w*.08),k,k*(1-w*.08)]})(),mix:r(),h:0.72+r()*0.2,chip:r(),cc:Math.floor(r()*4)});x+=w;}rowsData.push({off,cuts});}
  for(let y=0;y<size;y++){const ri=Math.floor(y/rowH),row=rowsData[ri],ly=y-ri*rowH,v=y/size;
    for(let x=0;x<size;x++){const xs=((x-row.off)%size+size)%size;let b=row.cuts[0];for(const cut of row.cuts){if(xs>=cut.x0&&xs<cut.x1){b=cut;break;}}
      const lx=xs-b.x0,bw=b.x1-b.x0,u=x/size;
      const jit=(NZ.fbm(u,v,64,2)-.5)*6;const dEdge=Math.min(lx,bw-lx,ly,rowH-ly)+jit;
      const m=2+NZ.v(u*128,v*128,128,128)*3;
      const grain=NZ.fbm(u,v,16,4),fine=NZ.v(u*256,v*256,256,256),streak=NZ.v(u*64+3,v*3,64,3),macro=NZ.fbm(u,v,4,2);
      let Rc,G,B,h,rough;
      // chipped corner
      let chipped=false;if(b.chip>0.72&&chipAmt>0){const cr=(b.chip-0.72)/0.28*30*chipAmt;const cx=b.cc&1?bw:0,cy=b.cc&2?rowH:0;if(Math.hypot(lx-cx,ly-cy)<cr*(0.6+0.8*fine))chipped=true;}
      if(dEdge<m||chipped){const k=0.75+fine*0.5;Rc=mortar[0]*k;G=mortar[1]*k;B=mortar[2]*k;h=(chipped?0.45:0.22)+fine*0.12;rough=1.0;}
      else{const bev=Math.min(1,(dEdge-m)/7);const mx=b.mix;const k=(0.72+grain*0.42)*(0.9+fine*0.2)*(0.88+macro*0.24);
        const sk=1-0.2*smooth(0.55,0.85,streak);
        Rc=(base[0]*(1-mx)+grey[0]*mx)*b.tint[0]*k*sk;G=(base[1]*(1-mx)+grey[1]*mx)*b.tint[1]*k*sk;B=(base[2]*(1-mx)+grey[2]*mx)*b.tint[2]*k*sk;
        h=b.h*(0.8+0.2*bev)+grain*0.12+fine*0.03;rough=0.7+grain*0.22+(1-bev)*0.08;}
      const i=y*size+x;px[i*4]=clamp(Rc,0,1)*255;px[i*4+1]=clamp(G,0,1)*255;px[i*4+2]=clamp(B,0,1)*255;px[i*4+3]=255;H[i]=h;Rg[i]=rough;}}
  ctx.putImageData(img,0,0);
  return {map:canvasTex(c),normalMap:normalFromHeight(H,size,size,7),roughnessMap:grayTex(Rg,size,size)};
}

function woodTexture({size=512,planks=6,base=[0.52,0.36,0.22],seed=5,vertical=false}={}){
  const r=mulberry32(seed);const c=makeCanvas(size,size),ctx=c.getContext('2d'),img=ctx.createImageData(size,size),px=img.data;
  const H=new Float32Array(size*size),Rg=new Float32Array(size*size);const pw=size/planks;
  const pl=[];for(let i=0;i<planks;i++)pl.push({t:0.75+r()*0.5,off:r()*100,knot:r()>0.5?[r()*size,r()*pw]:null,ph:r()*6});
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const a=vertical?x:y,b=vertical?y:x;const pi=Math.floor(a/pw),p=pl[pi],la=a-pi*pw;
    const u=b/size,v=a/size;const g=NZ.v(u*4+p.off,v*96,4,96);const grain=Math.sin((la/pw)*40+g*9+p.ph)*0.5+0.5;const fine=NZ.v(x*0.5,y*0.5);
    let k=p.t*(0.8+grain*0.25)*(0.9+fine*0.2);let h=0.6+grain*0.15+fine*0.05;
    const edge=Math.min(la,pw-la);if(edge<2.5){k*=0.45;h=0.3;}
    if(p.knot){const d=Math.hypot(b-p.knot[0],la-p.knot[1]);if(d<14){k*=0.55+d/30;h-=0.1;}}
    const i=y*size+x;px[i*4]=clamp(base[0]*k,0,1)*255;px[i*4+1]=clamp(base[1]*k,0,1)*255;px[i*4+2]=clamp(base[2]*k,0,1)*255;px[i*4+3]=255;H[i]=h;Rg[i]=0.7+grain*0.2;}
  ctx.putImageData(img,0,0);return {map:canvasTex(c),normalMap:normalFromHeight(H,size,size,5),roughnessMap:grayTex(Rg,size,size)};
}

function clothTexture({size=512,color=[0.8,0.75,0.65],weave=4,noise=0.15,fade=0,emblem=null,tatter=false,stripes=null}={}){
  const c=makeCanvas(size,size),ctx=c.getContext('2d');
  // base weave
  const img=ctx.createImageData(size,size),px=img.data;const H=new Float32Array(size*size);let A=null;if(tatter)A=new Float32Array(size*size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const u=x/size,v=y/size;let col=color;
    if(stripes){const s=Math.floor(u*stripes.n)%2;col=s?stripes.a:stripes.b;}
    const w=((Math.floor(x/weave)+Math.floor(y/weave))&1)?1:0.9;const n=NZ.fbm(u,v,8,4);const k=w*(1-noise+n*noise*2);
    let Rc=col[0]*k,G=col[1]*k,B=col[2]*k;
    if(fade>0){const f=fade*(0.4+0.6*NZ.fbm(u,v,4,2));Rc=lerp(Rc,0.78,f);G=lerp(G,0.72,f);B=lerp(B,0.6,f);}
    const i=y*size+x;px[i*4]=clamp(Rc,0,1)*255;px[i*4+1]=clamp(G,0,1)*255;px[i*4+2]=clamp(B,0,1)*255;px[i*4+3]=255;H[i]=0.5+w*0.1+n*0.1;
    if(A){const edge=NZ.v(u*32,0,32,1)*0.06+NZ.v(u*128,1,128,1)*0.02;A[i]=(1-v)>edge+0.02?1:0;}}
  ctx.putImageData(img,0,0);
  if(emblem){ctx.save();emblem(ctx,size);ctx.restore();}
  const o={map:canvasTex(c),normalMap:normalFromHeight(H,size,size,2)};if(A)o.alphaMap=grayTex(A,size,size);return o;
}

// ---- emblems (no lettering; heraldry only)
function drawSunEagle(ctx,S){const cx=S/2,cy=S*0.42,gold='#d9a83a',gold2='#f2cf6b';
  ctx.translate(cx,cy);
  // sun rays
  ctx.fillStyle=gold;for(let i=0;i<16;i++){ctx.save();ctx.rotate(i/16*Math.PI*2);ctx.beginPath();ctx.moveTo(-S*0.035,0);ctx.lineTo(0,-S*(i%2?0.3:0.36));ctx.lineTo(S*0.035,0);ctx.closePath();ctx.fill();ctx.restore();}
  ctx.beginPath();ctx.arc(0,0,S*0.2,0,Math.PI*2);ctx.fillStyle=gold2;ctx.fill();
  ctx.beginPath();ctx.arc(0,0,S*0.17,0,Math.PI*2);ctx.fillStyle='#1d3f86';ctx.fill();
  // eagle
  ctx.fillStyle=gold2;const w=S*0.16;
  ctx.beginPath();ctx.ellipse(0,S*0.02,S*0.035,S*0.08,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(0,-S*0.07,S*0.028,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(S*0.02,-S*0.075);ctx.lineTo(S*0.05,-S*0.06);ctx.lineTo(S*0.02,-S*0.05);ctx.fill();
  for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*S*0.02,-S*0.03);ctx.quadraticCurveTo(s*S*0.09,-S*0.12,s*w,-S*0.09);ctx.quadraticCurveTo(s*S*0.13,-S*0.02,s*S*0.14,S*0.02);
    for(let i=0;i<4;i++){ctx.lineTo(s*(S*0.13-i*S*0.03),S*(0.055-i*0.008));ctx.lineTo(s*(S*0.115-i*S*0.03),S*(0.03-i*0.005));}ctx.lineTo(s*S*0.02,S*0.06);ctx.closePath();ctx.fill();}
  ctx.beginPath();ctx.moveTo(-S*0.03,S*0.08);ctx.lineTo(-S*0.05,S*0.14);ctx.lineTo(0,S*0.12);ctx.lineTo(S*0.05,S*0.14);ctx.lineTo(S*0.03,S*0.08);ctx.closePath();ctx.fill();
  // lower gold band + chevrons
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=gold;ctx.fillRect(0,S*0.74,S,S*0.03);ctx.fillRect(0,S*0.80,S,S*0.012);
}
function drawTreeStag(ctx,S){const green='#2f4a24',dark='#243a1c';
  // green band bottom
  ctx.fillStyle=green;ctx.fillRect(0,S*0.78,S,S*0.22);ctx.fillStyle='#c9a24a';ctx.fillRect(0,S*0.765,S,S*0.018);
  ctx.translate(S/2,S*0.40);
  // tree
  ctx.fillStyle='#4a2f19';ctx.beginPath();ctx.moveTo(-S*0.03,S*0.18);ctx.lineTo(-S*0.015,-S*0.02);ctx.lineTo(S*0.015,-S*0.02);ctx.lineTo(S*0.03,S*0.18);ctx.lineTo(S*0.07,S*0.2);ctx.lineTo(-S*0.07,S*0.2);ctx.closePath();ctx.fill();
  ctx.fillStyle=dark;for(const [ox,oy,rad] of[[0,-0.12,0.11],[-0.08,-0.05,0.08],[0.08,-0.05,0.08],[-0.04,-0.16,0.07],[0.04,-0.16,0.07]]){ctx.beginPath();ctx.arc(ox*S,oy*S,rad*S,0,Math.PI*2);ctx.fill();}
  // stag head (frontal), left of tree; antlers
  ctx.save();ctx.translate(-S*0.27,-S*0.02);ctx.fillStyle=dark;ctx.strokeStyle=dark;ctx.lineCap='round';ctx.lineWidth=S*0.018;
  ctx.beginPath();ctx.ellipse(0,S*0.04,S*0.045,S*0.075,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(-S*0.055,-S*0.01,S*0.03,S*0.015,-0.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(S*0.055,-S*0.01,S*0.03,S*0.015,0.5,0,Math.PI*2);ctx.fill();
  for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*S*0.03,-S*0.03);ctx.quadraticCurveTo(s*S*0.09,-S*0.09,s*S*0.10,-S*0.19);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s*S*0.06,-S*0.08);ctx.lineTo(s*S*0.03,-S*0.15);ctx.stroke();ctx.beginPath();ctx.moveTo(s*S*0.085,-S*0.13);ctx.lineTo(s*S*0.135,-S*0.16);ctx.stroke();ctx.beginPath();ctx.moveTo(s*S*0.095,-S*0.17);ctx.lineTo(s*S*0.075,-S*0.23);ctx.stroke();}
  ctx.restore();
  // second stag mirrored on right
  ctx.save();ctx.translate(S*0.27,-S*0.02);ctx.fillStyle=dark;ctx.strokeStyle=dark;ctx.lineCap='round';ctx.lineWidth=S*0.018;
  ctx.beginPath();ctx.ellipse(0,S*0.04,S*0.045,S*0.075,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(-S*0.055,-S*0.01,S*0.03,S*0.015,-0.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(S*0.055,-S*0.01,S*0.03,S*0.015,0.5,0,Math.PI*2);ctx.fill();
  for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*S*0.03,-S*0.03);ctx.quadraticCurveTo(s*S*0.09,-S*0.09,s*S*0.10,-S*0.19);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s*S*0.06,-S*0.08);ctx.lineTo(s*S*0.03,-S*0.15);ctx.stroke();ctx.beginPath();ctx.moveTo(s*S*0.085,-S*0.13);ctx.lineTo(s*S*0.135,-S*0.16);ctx.stroke();ctx.beginPath();ctx.moveTo(s*S*0.095,-S*0.17);ctx.lineTo(s*S*0.075,-S*0.23);ctx.stroke();}
  ctx.restore();
}
function drawCityCrest(ctx,S){ctx.translate(S/2,S*0.36);const gold='#e0b04a';
  ctx.fillStyle=gold;ctx.beginPath();ctx.moveTo(-S*0.16,-S*0.16);ctx.lineTo(S*0.16,-S*0.16);ctx.lineTo(S*0.16,S*0.04);ctx.quadraticCurveTo(S*0.16,S*0.2,0,S*0.26);ctx.quadraticCurveTo(-S*0.16,S*0.2,-S*0.16,S*0.04);ctx.closePath();ctx.fill();
  ctx.fillStyle='#1d3f86';ctx.beginPath();ctx.moveTo(-S*0.13,-S*0.13);ctx.lineTo(S*0.13,-S*0.13);ctx.lineTo(S*0.13,S*0.04);ctx.quadraticCurveTo(S*0.13,S*0.17,0,S*0.22);ctx.quadraticCurveTo(-S*0.13,S*0.17,-S*0.13,S*0.04);ctx.closePath();ctx.fill();
  ctx.fillStyle=gold;// tower
  ctx.fillRect(-S*0.05,-S*0.04,S*0.1,S*0.18);for(let i=0;i<3;i++)ctx.fillRect(-S*0.05+i*S*0.04,-S*0.07,S*0.02,S*0.03);
  ctx.fillStyle='#1d3f86';ctx.beginPath();ctx.arc(0,S*0.1,S*0.02,Math.PI,0);ctx.lineTo(S*0.02,S*0.14);ctx.lineTo(-S*0.02,S*0.14);ctx.fill();
  ctx.fillStyle=gold;for(let i=0;i<8;i++){ctx.save();ctx.rotate(i/8*Math.PI*2);ctx.beginPath();ctx.moveTo(-S*0.008,-S*0.08);ctx.lineTo(0,-S*0.115);ctx.lineTo(S*0.008,-S*0.08);ctx.fill();ctx.restore();}
  ctx.beginPath();ctx.arc(0,-S*0.08,S*0.02,0,Math.PI*2);ctx.fill();
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=gold;ctx.fillRect(0,0,S,S*0.03);ctx.fillRect(0,S*0.06,S,S*0.012);ctx.fillRect(0,S*0.96,S,S*0.04);
}

// knotwork frieze: raised interlaced strands, partially worn
function knotTexture(w=1024,h=128,worn=true){
  const c=makeCanvas(w,h),ctx=c.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
  const P=128;const curve=(sign,x0,x1)=>{ctx.beginPath();for(let x=x0;x<=x1;x+=2){const y=h/2+sign*h*0.32*Math.sin(x/P*Math.PI*2);x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y);}};

  strand(1,-P,w+P);strand(-1,-P,w+P);

function archPath(off=0,path=new THREE.Path()){const {w,spring,r,cx,th}=ARCH;const hw=w/2+off,rr2=r+off;const th2=Math.acos(-cx/rr2);
  path.moveTo(-hw,-0.5);path.lineTo(-hw,spring);path.absarc(cx,spring,rr2,Math.PI,th2,true);path.absarc(-cx,spring,rr2,Math.PI-th2,0,true);path.lineTo(hw,-0.5);return path;}
function archPoints(off,n=90){const p=archPath(off);const pts=[];for(let i=0;i<=n;i++)pts.push(p.getPointAt(i/n));return pts;}
// sweep a rectangular section along the arch curve (front, outer, inner, back faces) with arc-length uv
function archBand(inner,outer,z0,z1,uRepeat=1,n=90){const pi=archPoints(inner,n),po=archPoints(outer,n);const pos=[],nrm=[],uv=[],idx=[];let L=0;const len=[0];for(let i=1;i<pi.length;i++){L+=pi[i].distanceTo(pi[i-1]);len.push(L);}
  const quad=(a,b,c,d,N)=>{const base=pos.length/3;pos.push(...a,...b,...c,...d);for(let k=0;k<4;k++)nrm.push(...N);idx.push(base,base+1,base+2,base,base+2,base+3);};
  for(let i=0;i<pi.length-1;i++){const s0=len[i]/L*uRepeat,s1=len[i+1]/L*uRepeat;const a=pi[i],b=pi[i+1],c=po[i],d=po[i+1];const t=new THREE.Vector2().subVectors(b,a).normalize();const on=[-t.y,t.x,0];
    quad([a.x,a.y,z1],[b.x,b.y,z1],[d.x,d.y,z1],[c.x,c.y,z1],[0,0,1]);uv.push(s0,0,s1,0,s1,1,s0,1);
    quad([c.x,c.y,z0],[d.x,d.y,z0],[b.x,b.y,z0],[a.x,a.y,z0],[0,0,-1]);uv.push(s0,1,s1,1,s1,0,s0,0);
    quad([c.x,c.y,z1],[d.x,d.y,z1],[d.x,d.y,z0],[c.x,c.y,z0],on);uv.push(s0,0,s1,0,s1,0.3,s0,0.3);
    quad([a.x,a.y,z0],[b.x,b.y,z0],[b.x,b.y,z1],[a.x,a.y,z1],[-on[0],-on[1],0]);uv.push(s0,0,s1,0,s1,0.3,s0,0.3);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);return g;}
