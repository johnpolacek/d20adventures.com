<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 List</title>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#1c1a22; color:#ebe8f0; font:16px/1.5 'Rethink Sans', system-ui, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:120px 24px; }
  h1 { font-size:14px; font-weight:500; color:#7d7889; margin:0 0 32px; }
  a { display:flex; justify-content:space-between; padding:14px 0; border-top:1px solid #2c2935; color:inherit; text-decoration:none; }
  a:last-child { border-bottom:1px solid #2c2935; }
  a span { color:#7d7889; font-variant-numeric:tabular-nums; }
  a:hover span { color:#ebe8f0; }
</style>
</head>
<body>
<main>
  <h1>Admin</h1>
  <a href="#">Games <span>31</span></a>
  <a href="#">Players <span>148</span></a>
  <a href="#">Feedback <span>62</span></a>
  <a href="#">Adventure Plans <span>4</span></a>
  <a href="#">Content Queue <span>9</span></a>
  <a href="#">AI Budget <span>$0.38 / $1</span></a>
</main>
</body>
</html>
