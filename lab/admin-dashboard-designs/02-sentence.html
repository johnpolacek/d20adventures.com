<!doctype html>
<html lang="en">
<head>

<title>02 Sentence</title>

<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#1c1a22; color:#ebe8f0; font:16px/1.5 'Rethink Sans', system-ui, sans-serif; }
  main { max-width:600px; margin:0 auto; padding:160px 24px; }
  p { font:400 26px/1.55 Literata, Georgia, serif; color:#a8a2b4; margin:0; }
  p a { color:#ebe8f0; text-decoration:none; border-bottom:1px solid #4a4556; }

</style>

<body>
<main>
  <p><a href="#">148 players</a> have played <a href="#">31 games</a> this week and left <a href="#">62 notes</a>. Today the GM has spent <a href="#">$0.38</a> of $1. There are <a href="#">4 adventures</a> and <a href="#">9 posts</a> in the queue.</p>
</main>
