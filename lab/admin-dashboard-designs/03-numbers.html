<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 Numbers</title>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#1c1a22; color:#ebe8f0; font:15px/1.5 'Rethink Sans', system-ui, sans-serif; }
  main { max-width:880px; margin:0 auto; padding:140px 24px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:56px 40px; }
  a { color:inherit; text-decoration:none; }
  b { display:block; font-size:44px; font-weight:400; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  span { color:#7d7889; }
  a:hover span { color:#ebe8f0; }
</style>
</head>
<body>
<main>
  <div class="grid">
    <a href="#"><b>31</b><span>Games</span></a>
    <a href="#"><b>148</b><span>Players</span></a>
    <a href="#"><b>62</b><span>Feedback</span></a>
    <a href="#"><b>4</b><span>Adventures</span></a>
    <a href="#"><b>9</b><span>Queued posts</span></a>
    <a href="#"><b>$0.38</b><span>of $1 today</span></a>
  </div>
</main>
</body>
</html>
