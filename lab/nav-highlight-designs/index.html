<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav Highlight Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700&family=Cinzel+Decorative:wght@400&display=swap" rel="stylesheet">
<style>
  /* Ways to mark the current section in Ledger's desk sidebar (components/admin/admin-sidebar.tsx, the `.up-side`
     rules in app/updates/updates.css). Each option is a real sidebar in Ledger's light and dark tones as they stand.
     Hover the other links to see their hover state beside the current one. Click any link to move the current one. */
  * { box-sizing: border-box; }
  body { margin: 0; background: #1b1714; color: #eadfcd; font: 15px/1.5 "Rethink Sans", system-ui, sans-serif; }
  main { max-width: 1440px; margin: 0 auto; padding: 32px 24px 80px; }
  header h1 { margin: 0 0 4px; font: 400 30px/1.2 "Cinzel Decorative", serif; }
  header p { margin: 0; color: #b8a68a; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 20px; margin-top: 28px; }
  .opt { border: 1px solid #3a3127; border-radius: 10px; overflow: hidden; background: #241e17; }
  .opt h2 { margin: 0; padding: 12px 16px 2px; font-size: 15px; font-weight: 600; }
  .opt h2 b { display: inline-block; min-width: 1.6em; color: #e3bf7a; }
  .opt .note { margin: 0; padding: 0 16px 12px; font-size: 13px; color: #b8a68a; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; }

  /* Ledger's tones, light and dark, as app/updates/updates.css has them now. */
  .light {
    --bg: #fff7eb; --raise: #f8eee0; --line: #f1d4b5; --line-strong: #dfbb96; --btn: #fffdf5;
    --text: #4a2800; --strong: #2f1000; --muted: #7d4b00; --faint: #875600;
    --accent: #2b4a7e; --accent-line: rgb(43 74 126 / .42); --slot: rgb(43 74 126 / .09);
  }
  .dark {
    --bg: #15110d; --raise: #1f1a14; --line: #3a3127; --line-strong: #52463a; --btn: #241e17;
    --text: #e3d6be; --strong: #f3e8d2; --muted: #b8a68a; --faint: #a69479;
    --accent: #a9bde0; --accent-line: rgb(169 189 224 / .45); --slot: rgb(169 189 224 / .12);
  }
  .side { position: relative; isolation: isolate; padding: 18px 14px; background: var(--bg); color: var(--text); }
  .side::before { content: ""; position: absolute; inset: 0; z-index: -1; background: url("../../public/images/app/backgrounds/paper-texture.png") 0 0 / 400px 400px; opacity: .5; mix-blend-mode: multiply; pointer-events: none; }
  .dark.side::before { opacity: .1; mix-blend-mode: screen; }
  .side .label { margin: 16px 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .side .label:first-child { margin-top: 0; }
  .side a { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 14px; color: var(--muted); text-decoration: none; cursor: pointer; transition: color 120ms, background-color 120ms, border-color 120ms, box-shadow 120ms; }
  .side a svg { width: 16px; height: 16px; opacity: .8; flex: none; }
  .side a:hover { color: var(--strong); }

  /* ── The options. Each styles `a.on` and, where it helps, the hover of the others. ── */

  /* A: today's, for reference */
  .o-a a.on { background: var(--raise); font-weight: 600; color: var(--strong); box-shadow: inset 2px 0 0 var(--accent); }

  /* B: the quiet fill alone */
  .o-b a.on { background: var(--raise); font-weight: 600; color: var(--strong); }

  /* C: ink only: bolder and darker, no fill */
  .o-c a.on { font-weight: 600; color: var(--strong); }
  .o-c a.on svg { opacity: 1; }

  /* D: the accent: the word and its icon in blue, no fill */
  .o-d a.on { font-weight: 600; color: var(--accent); }
  .o-d a.on svg { opacity: 1; }

  /* E: a lifted card: the lighter button paper, a hairline and a soft shadow */
  .o-e a { border: 1px solid transparent; }
  .o-e a.on { background: var(--btn); border-color: var(--line); font-weight: 600; color: var(--strong); box-shadow: 0 1px 2px rgb(58 40 20 / .08); }
  .dark.o-e a.on { box-shadow: none; border-color: var(--line-strong); }

  /* F: a ruled outline, no fill */
  .o-f a { border: 1px solid transparent; }
  .o-f a.on { border-color: var(--line-strong); font-weight: 600; color: var(--strong); }

  /* G: a pill: the quiet fill, fully rounded */
  .o-g a { border-radius: 99px; padding-left: 12px; }
  .o-g a.on { background: var(--raise); font-weight: 600; color: var(--strong); }
  .o-g a:not(.on):hover { background: color-mix(in srgb, var(--raise) 50%, transparent); }

  /* H: ink reversed: dark ink fill, paper words */
  .o-h a.on { background: var(--strong); font-weight: 600; color: var(--bg); }

  /* I: a dot in the accent at the right end */
  .o-i a.on { font-weight: 600; color: var(--strong); }
  .o-i a.on::after { content: ""; margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  /* J: an underline in the accent under the word alone */
  .o-j a.on { font-weight: 600; color: var(--strong); }
  .o-j a.on span { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 5px; }

  /* K: the fill, with the word in the accent */
  .o-k a.on { background: var(--raise); font-weight: 600; color: var(--accent); }
  .o-k a.on svg { opacity: 1; }

  /* L: a faint blue tint: the accent at 7%, with blue words */
  .o-l a.on { background: color-mix(in srgb, var(--accent) 7%, transparent); font-weight: 600; color: var(--accent); }

  /* M: the fill, with the hover the same fill at half */
  .o-m a.on { background: var(--raise); font-weight: 600; color: var(--strong); }
  .o-m a:not(.on):hover { background: color-mix(in srgb, var(--raise) 55%, transparent); }

  /* N: a short tick under the icon's column, a mark beside the word rather than a rule down the edge */
  .o-n a.on { font-weight: 600; color: var(--strong); }
  .o-n a.on::before { content: ""; position: absolute; left: 0; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: var(--accent); }
  .o-n a { padding-left: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Nav Highlight Designs</h1>
    <p>Ways to mark the current section in the admin sidebar, each in Ledger’s light and dark tones. Hover the other links to see their hover beside the current one, and click any link to move the current one. A is today’s, with the left bar.</p>
  </header>
  <div class="grid" id="grid"></div>
</main>
<template id="nav">
  <p class="label" hidden></p>
  <a data-i="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg><span>Overview</span></a>
  <a data-i="1" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><span>Content Queue</span></a>
  <p class="label">Play</p>
  <a data-i="2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4M8 10v4M15 13h.01M18 11h.01"/></svg><span>Games</span></a>
  <a data-i="3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Players</span></a>
  <a data-i="4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Feedback</span></a>
  <p class="label">Build</p>
  <a data-i="5"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M12 11h4M12 16h4M8 11h.01M8 16h.01"/></svg><span>Adventure Plans</span></a>
  <a data-i="6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.55-2.5 5.55-5.55C21.97 6.01 17.46 2 12 2z"/></svg><span>UI</span></a>
</template>
<script>
  const options = [
    ["a", "Today’s", "The quiet fill with a 2px accent bar down the left edge."],
    ["b", "Quiet Fill", "The raised tone and bolder ink, nothing else."],
    ["c", "Ink Only", "Bolder, darker words. No fill, no mark."],
    ["d", "Accent Words", "The word and icon in the accent blue. No fill."],
    ["e", "Lifted Card", "The lighter button paper with a hairline, like a tab pulled forward."],
    ["f", "Ruled Outline", "A hairline round the item, no fill."],
    ["g", "Pill", "The quiet fill, fully rounded. Hover shows half of it."],
    ["h", "Ink Reversed", "Dark ink fill with paper words. The strongest."],
    ["i", "Accent Dot", "Bolder words with a small blue dot at the right end."],
    ["j", "Underline", "Bolder words, underlined in the accent."],
    ["k", "Fill + Accent Words", "The quiet fill with the word and icon in blue."],
    ["l", "Blue Tint", "A very faint blue fill with blue words."],
    ["m", "Fill with Hover Echo", "The quiet fill, and hovering another shows half of it."],
    ["n", "Leading Dot", "A small blue dot before the icon, in the gutter."],
  ]
  const grid = document.getElementById("grid")
  const tpl = document.getElementById("nav")
  for (const [key, name, note] of options) {
    const opt = document.createElement("section")
    opt.className = "opt"
    opt.innerHTML = `<h2><b>${key.toUpperCase()}</b>${name}</h2><p class="note">${note}</p><div class="pair"></div>`
    for (const look of ["light", "dark"]) {
      const side = document.createElement("nav")
      side.className = `side ${look} o-${key}`
      side.append(tpl.content.cloneNode(true))
      side.querySelector(".label[hidden]").remove()
      opt.querySelector(".pair").append(side)
    }
    // A click moves the current item in both looks of the option.
    opt.addEventListener("click", (e) => {
      const a = e.target.closest("a")
      if (!a) return
      opt.querySelectorAll("a").forEach((x) => x.classList.toggle("on", x.dataset.i === a.dataset.i))
    })
    grid.append(opt)
  }
</script>
</body>
</html>
